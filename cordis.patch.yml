# The @qiaoy01/mission bundle patch: inserts the mission service, the
# model-facing mission tools, the trigger companion, the (tolerant) invariant
# companion, the autonomous driver host, and the session-projection unit.
#
# mission-driver defaults are conservative: deterministic task selection and
# no automatic replan, so the default composition costs no model calls. Set
#   config: { decider: llm, replan: true }
# on the mission-driver row to enable model-driven strategies.
- insert:
    - id: mission
      name: '@qiaoy01/mission'

    - id: mission-tool
      name: '@qiaoy01/mission/tool'

    # Trigger companion: a soft-guidance prompt section that routes trigger
    # phrases ("mission:", "创建任务", "create mission", "/mission"...) into
    # mission_create + mission_plan, plus a `/mission` slash command. Tolerant:
    # no-op where dsh-system-prompt / dsh-commands are absent.
    - id: mission-trigger
      name: '@qiaoy01/mission/trigger'

    # Tolerant: registers only when the `invariants` service exists (dev/test
    # compositions); a shipped host without dsh-invariants is a no-op.
    - id: mission-invariant
      name: '@qiaoy01/mission/invariant'

    # The autonomous loop host: drives the owning session's mission whenever
    # the agent is idle (claim -> subagent execute -> report -> verify), with
    # lazy lease reclamation.
    - id: mission-driver
      name: '@qiaoy01/mission/driver-host'

    # UI data plane: the `mission` session projection unit (no-op where the
    # session-projection registry is absent).
    - id: mission-projection
      name: '@qiaoy01/mission/projection'
