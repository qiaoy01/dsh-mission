name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install

      - name: Build (typecheck + emit lib/)
        run: npm run build

      - name: Domain tests (pure, zero dsh deps)
        run: node --experimental-strip-types tests/domain.test.mjs

      - name: Runtime tests (real cordis/session/agent)
        run: node tests/service.test.mjs

      - name: Driver loop tests
        run: node tests/driver.test.mjs

      - name: Driver host tests
        run: node tests/driver-host.test.mjs

      - name: Trigger tests
        run: node tests/trigger.test.mjs

      - name: Projection tests
        run: node --experimental-strip-types tests/projection.test.mjs
